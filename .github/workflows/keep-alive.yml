name: Keep Render awake

# Ping o backend a cada 10 minutos pra ele nunca completar os ~15 min de
# inatividade que fazem o plano gratuito do Render hibernar o serviço. Sem
# isso, quem abre o site depois de um tempo parado cai na tela de "acordando"
# do Render por 30-50s, como se o site tivesse saído do ar.
#
# Usa GitHub Actions em vez de um serviço externo (tipo cron-job.org) porque
# não crio conta em serviço de terceiro em nome de ninguém — isso já roda em
# cima da conta do GitHub que o projeto já usa, sem cadastro novo.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pingar /api/health
        run: curl -sf --max-time 20 https://gopersonalhub.online/api/health || echo "ping falhou (serviço pode estar hibernando/reiniciando nesse ciclo)"
